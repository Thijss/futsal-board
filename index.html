<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7c2a7" />
    <title>Futsal Board</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/js/main.js"></script>
  </head>
  <body>
    <main class="pitch" id="pitch" aria-label="Futsal tactics board; drag players and ball to reposition them">
      <svg class="pitch-lines" viewBox="0 0 640 1280" aria-hidden="true">
        <rect x="22" y="44" width="596" height="1192" />
        <path d="M22 640h596" />
        <circle cx="320" cy="640" r="89" />
        <circle class="pitch-mark" cx="320" cy="640" r="3" />
        <path d="M96 44a179 179 0 0 0 179 179h90a179 179 0 0 0 179-179M96 1236a179 179 0 0 1 179-179h90a179 179 0 0 1 179 179" />
        <circle class="pitch-mark" cx="320" cy="223" r="3" />
        <circle class="pitch-mark" cx="320" cy="1057" r="3" />
        <path d="M22 51.5a7.5 7.5 0 0 0 7.5-7.5M610.5 44a7.5 7.5 0 0 0 7.5 7.5M22 1228.5a7.5 7.5 0 0 1 7.5 7.5M610.5 1236a7.5 7.5 0 0 1 7.5-7.5" />
        <path class="goal" d="M275 44V26h90v18M275 1236v18h90v-18" />
      </svg>
      <svg class="drawings" id="drawings" viewBox="0 0 640 1280" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="pieces" class="pieces"></div>
      <div class="board-controls">
        <button class="draw-button" id="drawButton" type="button" aria-label="Toggle drawing mode" aria-pressed="false" title="Draw on court">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m14 5 5 5M4 20l4.5-1 10-10a2.12 2.12 0 0 0-3-3l-10 10L4 20Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button class="reset-button" id="resetButton" type="button" aria-label="Reset positions" title="Reset positions">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </main>
  </body>
</html>
